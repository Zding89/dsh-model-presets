  <rect x="72" y="394" width="210" height="42" rx="21" fill="#262934"/>
  <text x="92" y="421" fill="#E1E3EA" font-family="Inter,Arial,sans-serif" font-size="14">DeepSeek Chat</text>
  <text x="218" y="421" fill="#9499A8" font-family="Inter,Arial,sans-serif" font-size="13">高⌄</text>
  <text x="72" y="476" fill="#727785" font-family="Inter,Arial,sans-serif" font-size="12">Interface preview · actual colors follow the active DSH theme</text>
