<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">DSH Model Presets interface preview</title>
  <desc id="desc">A compact dark model menu with pinned presets, model search, and wrapped reasoning effort buttons.</desc>
  <defs>
    <linearGradient id="canvas" x1="80" y1="20" x2="880" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171922"/>
      <stop offset="1" stop-color="#0C0D12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#canvas)"/>
  <text x="72" y="94" fill="#F3F4F7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">DSH Model Presets</text>
  <text x="72" y="126" fill="#9499A8" font-family="Inter,Arial,sans-serif" font-size="16">模型和推理等级，一次保存，一键切换</text>
  <g filter="url(#shadow)">
    <rect x="530" y="48" width="350" height="430" rx="18" fill="#24262E" stroke="#3B3E48"/>
    <g font-family="Inter,Arial,sans-serif">
      <rect x="544" y="62" width="137" height="34" rx="9" fill="#333641"/>
      <text x="558" y="84" fill="#C9CCFF" font-size="12">DeepSeek · 高</text>
      <rect x="687" y="62" width="113" height="34" rx="9" fill="#2B2E37"/>
      <text x="701" y="84" fill="#C7CAD3" font-size="12">GPT-5 · 中</text>
      <rect x="806" y="62" width="28" height="34" rx="9" fill="#2B2E37"/>
      <text x="815" y="85" fill="#DBDDE4" font-size="18">+</text>
      <text x="844" y="84" fill="#A8ACB8" font-size="18">⋯</text>
      <rect x="544" y="108" width="322" height="38" rx="10" fill="#1D1F26"/>
      <text x="558" y="132" fill="#7F8492" font-size="13">⌕  搜索模型</text>
      <text x="554" y="178" fill="#858A99" font-size="11" font-weight="600">DEEPSEEK</text>
      <rect x="544" y="188" width="322" height="42" rx="10" fill="#31343F"/>
      <text x="558" y="214" fill="#AEB5FF" font-size="14">DeepSeek Chat</text>
      <text x="820" y="214" fill="#AEB5FF" font-size="12">高</text>
      <g>
        <rect x="558" y="240" width="58" height="32" rx="8" fill="#30333D"/>
        <text x="573" y="261" fill="#C5C8D1" font-size="11">默认</text>
        <rect x="622" y="240" width="48" height="32" rx="8" fill="#30333D"/>
        <text x="637" y="261" fill="#C5C8D1" font-size="11">低</text>
        <rect x="676" y="240" width="48" height="32" rx="8" fill="#30333D"/>
        <text x="691" y="261" fill="#C5C8D1" font-size="11">中</text>
        <rect x="730" y="240" width="48" height="32" rx="8" fill="#4A4F72"/>
        <text x="745" y="261" fill="#DCE0FF" font-size="11">高</text>
        <rect x="558" y="278" width="58" height="32" rx="8" fill="#30333D"/>
        <text x="573" y="299" fill="#C5C8D1" font-size="11">极高</text>
      </g>
      <text x="554" y="340" fill="#858A99" font-size="11" font-weight="600">OPENAI</text>
      <text x="558" y="376" fill="#DADCE3" font-size="14">GPT-5</text>
      <text x="838" y="376" fill="#8C919F" font-size="14">›</text>
      <text x="558" y="420" fill="#DADCE3" font-size="14">GPT-5 mini</text>
